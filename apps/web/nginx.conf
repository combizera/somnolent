server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Hashes no nome dos assets: cache longo neles, nenhum no index.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA: qualquer rota cai no index (os links de share usam fragmento).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
