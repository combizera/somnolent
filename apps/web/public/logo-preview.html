<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Somnolent — Logo Preview</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #16161b;
      color: #e6e6ee;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      padding: 64px 24px 96px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 72px;
    }

    .page-header {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .eyebrow {
      font-size: 11px;
      font-weight: 600;
      color: #6a6a7c;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .subtitle { font-size: 13px; color: #6a6a7c; }

    .section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      max-width: 820px;
      width: 100%;
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #9a9aad;
      align-self: flex-start;
      padding-left: 2px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      width: 100%;
    }

    .card {
      background: #1c1c23;
      border: 1px solid #2e2e3a;
      border-radius: 18px;
      padding: 40px 20px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    .card-body {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .sep-h { width: 100%; height: 1px; background: #2e2e3a; }

    .wordmark-row {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .wordmark {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.025em;
      color: #e6e6ee;
      white-space: nowrap;
    }

    .card-label {
      font-size: 10px;
      font-weight: 600;
      color: #6a6a7c;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      text-align: center;
    }

    /* ref card */
    .ref-row {
      display: flex;
      align-items: center;
      gap: 16px;
      background: #1c1c23;
      border: 1px solid #3a3050;
      border-radius: 14px;
      padding: 18px 24px;
      align-self: flex-start;
    }

    .ref-label {
      font-size: 11px;
      color: #6a6a7c;
      white-space: nowrap;
    }

    /* favicon */
    .favicon-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      background: #1c1c23;
      border: 1px solid #2e2e3a;
      border-radius: 18px;
      padding: 32px 24px 20px;
      width: 100%;
    }

    .fav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .fav-sizes {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .caption {
      font-size: 10px;
      font-weight: 600;
      color: #6a6a7c;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="page-header">
    <p class="eyebrow">Somnolent — Logo Preview</p>
    <p class="subtitle">Luna 2 (crescent + estrela) · 4 variações</p>
  </div>

  <!-- referência -->
  <div class="section">
    <p class="section-title">Referência aprovada</p>
    <div class="ref-row">
      <svg width="48" height="48" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <mask id="ref-m">
            <rect width="56" height="56" fill="white"/>
            <circle cx="36" cy="22" r="19.5" fill="black"/>
          </mask>
        </defs>
        <circle cx="27" cy="29" r="21" fill="#7c5cff" mask="url(#ref-m)"/>
        <path d="M42 11 L43.4 14.6 L47 16 L43.4 17.4 L42 21 L40.6 17.4 L37 16 L40.6 14.6 Z" fill="#9179ff"/>
        <circle cx="48" cy="26" r="1.8" fill="#7c5cff" opacity="0.5"/>
      </svg>
      <span class="ref-label">L2 original — base das 4 variações abaixo</span>
    </div>
  </div>

  <!-- ══════════════════════════════════
       4 variações de L2
  ══════════════════════════════════════ -->
  <div class="section">
    <p class="section-title">Variações</p>
    <div class="grid">

      <!-- ── A: Gradiente + Estrela ──── -->
      <!--
        Crescent com gradient suave (lilás → índigo)
        + mesma estrela de L2.
        Mistura elegância de cor com o charme da estrela.
      -->
      <div class="card">
        <div class="card-body">
          <svg width="68" height="68" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="ga" x1="6" y1="8" x2="46" y2="46" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#c4b0ff"/>
                <stop offset="100%" stop-color="#5b3fd4"/>
              </linearGradient>
              <mask id="ma">
                <rect width="56" height="56" fill="white"/>
                <circle cx="36" cy="22" r="19.5" fill="black"/>
              </mask>
            </defs>
            <circle cx="27" cy="29" r="21" fill="url(#ga)" mask="url(#ma)"/>
            <!-- estrela 4 pontas -->
            <path d="M42 11 L43.4 14.6 L47 16 L43.4 17.4 L42 21 L40.6 17.4 L37 16 L40.6 14.6 Z"
                  fill="white" opacity="0.9"/>
          </svg>

          <div class="sep-h"></div>

          <div class="wordmark-row">
            <svg width="24" height="24" viewBox="0 0 56 56" fill="none">
              <defs>
                <linearGradient id="ga-sm" x1="6" y1="8" x2="46" y2="46" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#c4b0ff"/><stop offset="100%" stop-color="#5b3fd4"/>
                </linearGradient>
                <mask id="ma-sm"><rect width="56" height="56" fill="white"/><circle cx="36" cy="22" r="19.5" fill="black"/></mask>
              </defs>
              <circle cx="27" cy="29" r="21" fill="url(#ga-sm)" mask="url(#ma-sm)"/>
              <path d="M42 11 L43.4 14.6 L47 16 L43.4 17.4 L42 21 L40.6 17.4 L37 16 L40.6 14.6 Z" fill="white" opacity="0.9"/>
            </svg>
            <span class="wordmark">somnolent</span>
          </div>
        </div>
        <span class="card-label">A · Gradiente</span>
      </div>

      <!-- ── B: Constelação (3 dots) ─── -->
      <!--
        Crescent + 3 pontos/estrelas dispersos,
        como uma constelação noturna.
        Mais sutil, sofisticado.
      -->
      <div class="card">
        <div class="card-body">
          <svg width="68" height="68" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <mask id="mb">
                <rect width="56" height="56" fill="white"/>
                <circle cx="36" cy="22" r="19.5" fill="black"/>
              </mask>
            </defs>
            <circle cx="27" cy="29" r="21" fill="#7c5cff" mask="url(#mb)"/>
            <!-- 3 estrelas como constelação -->
            <!-- maior, mais brilhante -->
            <path d="M43 11 L44.1 14.1 L47 15 L44.1 15.9 L43 19 L41.9 15.9 L39 15 L41.9 14.1 Z"
                  fill="#c4b0ff"/>
            <!-- média -->
            <circle cx="49" cy="22" r="2" fill="#9179ff" opacity="0.7"/>
            <!-- pequenininha -->
            <circle cx="46" cy="27" r="1.2" fill="#7c5cff" opacity="0.45"/>
            <!-- linha pontilhada conectando (opcional) -->
            <line x1="43" y1="19" x2="49" y2="22" stroke="#7c5cff" stroke-width="0.6" stroke-dasharray="1.5 2" opacity="0.3"/>
            <line x1="49" y1="22" x2="46" y2="27" stroke="#7c5cff" stroke-width="0.6" stroke-dasharray="1.5 2" opacity="0.3"/>
          </svg>

          <div class="sep-h"></div>

          <div class="wordmark-row">
            <svg width="24" height="24" viewBox="0 0 56 56" fill="none">
              <defs>
                <mask id="mb-sm"><rect width="56" height="56" fill="white"/><circle cx="36" cy="22" r="19.5" fill="black"/></mask>
              </defs>
              <circle cx="27" cy="29" r="21" fill="#7c5cff" mask="url(#mb-sm)"/>
              <path d="M43 11 L44.1 14.1 L47 15 L44.1 15.9 L43 19 L41.9 15.9 L39 15 L41.9 14.1 Z" fill="#c4b0ff"/>
              <circle cx="49" cy="22" r="2" fill="#9179ff" opacity="0.7"/>
              <circle cx="46" cy="27" r="1.2" fill="#7c5cff" opacity="0.45"/>
            </svg>
            <span class="wordmark">somnolent</span>
          </div>
        </div>
        <span class="card-label">B · Constelação</span>
      </div>

      <!-- ── C: Brilho (sparkle) ─────── -->
      <!--
        Crescent + sparkle ✦ com braços longos e finos.
        Mais etéreo, "magical".
      -->
      <div class="card">
        <div class="card-body">
          <svg width="68" height="68" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <mask id="mc">
                <rect width="56" height="56" fill="white"/>
                <circle cx="36" cy="22" r="19.5" fill="black"/>
              </mask>
            </defs>
            <circle cx="27" cy="29" r="21" fill="#7c5cff" mask="url(#mc)"/>
            <!--
              Sparkle ✦ com braços longos (vertical/horizontal)
              e braços curtos nas diagonais.
              Centro: (43, 15)
            -->
            <path d="M43 9 L44 13.3 L49 15 L44 16.7 L43 21
                     L42 16.7 L37 15 L42 13.3 Z"
                  fill="#e0d4ff"/>
            <!-- pontinhos nas diagonais -->
            <circle cx="47.5" cy="10.5" r="1.1" fill="#9179ff" opacity="0.55"/>
            <circle cx="38.5" cy="10.5" r="0.7" fill="#9179ff" opacity="0.35"/>
          </svg>

          <div class="sep-h"></div>

          <div class="wordmark-row">
            <svg width="24" height="24" viewBox="0 0 56 56" fill="none">
              <defs>
                <mask id="mc-sm"><rect width="56" height="56" fill="white"/><circle cx="36" cy="22" r="19.5" fill="black"/></mask>
              </defs>
              <circle cx="27" cy="29" r="21" fill="#7c5cff" mask="url(#mc-sm)"/>
              <path d="M43 9 L44 13.3 L49 15 L44 16.7 L43 21 L42 16.7 L37 15 L42 13.3 Z" fill="#e0d4ff"/>
            </svg>
            <span class="wordmark">somnolent</span>
          </div>
        </div>
        <span class="card-label">C · Brilho</span>
      </div>

      <!-- ── D: Estrela no arco ─────── -->
      <!--
        Estrela posicionada DENTRO do arco côncavo da lua,
        abraçada pelos "chifres" do crescent.
        Referência à meia-lua islâmica/clássica, muito reconhecível.
      -->
      <div class="card">
        <div class="card-body">
          <svg width="68" height="68" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <mask id="md">
                <rect width="56" height="56" fill="white"/>
                <circle cx="36" cy="22" r="19.5" fill="black"/>
              </mask>
            </defs>
            <circle cx="27" cy="29" r="21" fill="#7c5cff" mask="url(#md)"/>
            <!--
              Estrela cradled — dentro do arco côncavo.
              Centro: ~(38, 28) — no espaço aberto entre os chifres.
              Outer r=5, inner r=2 para uma estrela de 4 pontas.
            -->
            <path d="M38 23 L39.4 26.6 L43 28 L39.4 29.4 L38 33 L36.6 29.4 L33 28 L36.6 26.6 Z"
                  fill="#9179ff"/>
          </svg>

          <div class="sep-h"></div>

          <div class="wordmark-row">
            <svg width="24" height="24" viewBox="0 0 56 56" fill="none">
              <defs>
                <mask id="md-sm"><rect width="56" height="56" fill="white"/><circle cx="36" cy="22" r="19.5" fill="black"/></mask>
              </defs>
              <circle cx="27" cy="29" r="21" fill="#7c5cff" mask="url(#md-sm)"/>
              <path d="M38 23 L39.4 26.6 L43 28 L39.4 29.4 L38 33 L36.6 29.4 L33 28 L36.6 26.6 Z" fill="#9179ff"/>
            </svg>
            <span class="wordmark">somnolent</span>
          </div>
        </div>
        <span class="card-label">D · Estrela no Arco</span>
      </div>

    </div>
  </div>

  <!-- ══════════════════════════════════
       Favicon — 32 · 16 px
  ══════════════════════════════════════ -->
  <div class="section">
    <p class="section-title">Favicon — 32px · 16px</p>
    <div class="favicon-grid">

      <!-- A fav -->
      <div class="fav-item">
        <div class="fav-sizes">
          <svg width="32" height="32" viewBox="0 0 56 56" fill="none">
            <defs>
              <linearGradient id="fga-32" x1="6" y1="8" x2="46" y2="46" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#c4b0ff"/><stop offset="100%" stop-color="#5b3fd4"/>
              </linearGradient>
              <mask id="fma-32"><rect width="56" height="56" fill="white"/><circle cx="36" cy="22" r="19.5" fill="black"/></mask>
            </defs>
            <circle cx="27" cy="29" r="21" fill="url(#fga-32)" mask="url(#fma-32)"/>
            <path d="M42 11 L43.4 14.6 L47 16 L43.4 17.4 L42 21 L40.6 17.4 L37 16 L40.6 14.6 Z" fill="white" opacity="0.9"/>
          </svg>
          <svg width="16" height="16" viewBox="0 0 56 56" fill="none">
            <defs>
              <linearGradient id="fga-16" x1="6" y1="8" x2="46" y2="46" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#c4b0ff"/><stop offset="100%" stop-color="#5b3fd4"/>
              </linearGradient>
              <mask id="fma-16"><rect width="56" height="56" fill="white"/><circle cx="36" cy="22" r="19.5" fill="black"/></mask>
            </defs>
            <circle cx="27" cy="29" r="21" fill="url(#fga-16)" mask="url(#fma-16)"/>
            <path d="M42 11 L43.4 14.6 L47 16 L43.4 17.4 L42 21 L40.6 17.4 L37 16 L40.6 14.6 Z" fill="white" opacity="0.9"/>
          </svg>
        </div>
        <span class="caption">A</span>
      </div>

      <!-- B fav -->
      <div class="fav-item">
        <div class="fav-sizes">
          <svg width="32" height="32" viewBox="0 0 56 56" fill="none">
            <defs><mask id="fmb-32"><rect width="56" height="56" fill="white"/><circle cx="36" cy="22" r="19.5" fill="black"/></mask></defs>
            <circle cx="27" cy="29" r="21" fill="#7c5cff" mask="url(#fmb-32)"/>
            <path d="M43 11 L44.1 14.1 L47 15 L44.1 15.9 L43 19 L41.9 15.9 L39 15 L41.9 14.1 Z" fill="#c4b0ff"/>
            <circle cx="49" cy="22" r="2" fill="#9179ff" opacity="0.7"/>
            <circle cx="46" cy="27" r="1.2" fill="#7c5cff" opacity="0.45"/>
          </svg>
          <svg width="16" height="16" viewBox="0 0 56 56" fill="none">
            <defs><mask id="fmb-16"><rect width="56" height="56" fill="white"/><circle cx="36" cy="22" r="19.5" fill="black"/></mask></defs>
            <circle cx="27" cy="29" r="21" fill="#7c5cff" mask="url(#fmb-16)"/>
            <path d="M43 11 L44.1 14.1 L47 15 L44.1 15.9 L43 19 L41.9 15.9 L39 15 L41.9 14.1 Z" fill="#c4b0ff"/>
            <circle cx="49" cy="22" r="2" fill="#9179ff" opacity="0.7"/>
          </svg>
        </div>
        <span class="caption">B</span>
      </div>

      <!-- C fav -->
      <div class="fav-item">
        <div class="fav-sizes">
          <svg width="32" height="32" viewBox="0 0 56 56" fill="none">
            <defs><mask id="fmc-32"><rect width="56" height="56" fill="white"/><circle cx="36" cy="22" r="19.5" fill="black"/></mask></defs>
            <circle cx="27" cy="29" r="21" fill="#7c5cff" mask="url(#fmc-32)"/>
            <path d="M43 9 L44 13.3 L49 15 L44 16.7 L43 21 L42 16.7 L37 15 L42 13.3 Z" fill="#e0d4ff"/>
          </svg>
          <svg width="16" height="16" viewBox="0 0 56 56" fill="none">
            <defs><mask id="fmc-16"><rect width="56" height="56" fill="white"/><circle cx="36" cy="22" r="19.5" fill="black"/></mask></defs>
            <circle cx="27" cy="29" r="21" fill="#7c5cff" mask="url(#fmc-16)"/>
            <path d="M43 9 L44 13.3 L49 15 L44 16.7 L43 21 L42 16.7 L37 15 L42 13.3 Z" fill="#e0d4ff"/>
          </svg>
        </div>
        <span class="caption">C</span>
      </div>

      <!-- D fav -->
      <div class="fav-item">
        <div class="fav-sizes">
          <svg width="32" height="32" viewBox="0 0 56 56" fill="none">
            <defs><mask id="fmd-32"><rect width="56" height="56" fill="white"/><circle cx="36" cy="22" r="19.5" fill="black"/></mask></defs>
            <circle cx="27" cy="29" r="21" fill="#7c5cff" mask="url(#fmd-32)"/>
            <path d="M38 23 L39.4 26.6 L43 28 L39.4 29.4 L38 33 L36.6 29.4 L33 28 L36.6 26.6 Z" fill="#9179ff"/>
          </svg>
          <svg width="16" height="16" viewBox="0 0 56 56" fill="none">
            <defs><mask id="fmd-16"><rect width="56" height="56" fill="white"/><circle cx="36" cy="22" r="19.5" fill="black"/></mask></defs>
            <circle cx="27" cy="29" r="21" fill="#7c5cff" mask="url(#fmd-16)"/>
            <path d="M38 23 L39.4 26.6 L43 28 L39.4 29.4 L38 33 L36.6 29.4 L33 28 L36.6 26.6 Z" fill="#9179ff"/>
          </svg>
        </div>
        <span class="caption">D</span>
      </div>

    </div>
  </div>

</body>
</html>
